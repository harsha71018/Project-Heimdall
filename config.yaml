# ==============================================================================
# Job Hunter & Excel Dashboard Configuration
# ==============================================================================

# Search settings
search:
  # Target job roles
  job_titles:
    - "Data Analyst"
    - "Data Annotator"
    - "SQL Developer"
    - "Power BI Developer"

  # Target Location
  location: "Hyderabad"

  # Experience level filter & ceiling gate
  experience_filter: "0-2 years"
  max_experience_years: 2      # Strict ceiling: discard jobs requiring > 2 years minimum
  
  # Max age of job postings in hours (24h for fresh daily listings)
  hours_old: 24
  
  # Target number of jobs to fetch per title via JobSpy (kept at 12 to prevent LinkedIn 429 rate limits)
  results_wanted_per_role: 12
  
  # Platforms to search across: linkedin, indeed
  platforms:
    - "linkedin"
    - "indeed"
    
  indeed_country: "india"

# ==============================================================================
# Scraping Modes & Firecrawl Engine Configuration
# ==============================================================================
# Choose default scraping mode: "frugal", "balanced", or "exhaustive"
default_mode: "balanced"

modes:
  frugal:
    search_limit_per_role: 10
    deep_scrape: false
    timeout: 20
    description: "8 credits total: Fast SERP snippets (4 roles x 2 search credits)"

  balanced:
    search_limit_per_role: 4
    deep_scrape: true
    timeout: 60
    description: "24 credits total: Full markdown on top 4 listings per role (4 roles x (2 search + 4 scrape))"

  exhaustive:
    search_limit_per_role: 10
    deep_scrape: true
    timeout: 60
    description: "48 credits total: Full markdown on top 10 listings per role (4 roles x (2 search + 10 scrape))"

firecrawl:
  enabled: true

# Skill Extraction & Highlighting
skills_filter:
  target_skills:
    - "SQL"
    - "Power BI"
    - "Python"
    - "Excel"
    - "Advanced Excel"
    - "Tableau"
    - "Data Annotation"
    - "Data Cleaning"
    - "ETL"
    - "PostgreSQL"
    - "MySQL"
    - "Pandas"
    - "NumPy"
    - "Statistics"
    - "Data Modeling"
    - "DAX"
    - "Power Query"
    - "Machine Learning"
    - "AI"
    - "Azure"
    - "AWS"
    - "Git"
    - "Snowflake"
    - "BigQuery"

# Excel Output Settings
output:
  filename: "Job_Applications_Tracker.xlsx"
  sheet_name: "Active Job Leads"
  
  status_options:
    - "Not Applied"
    - "Applied"
    - "Referral Requested"
    - "Screening Call"
    - "Interviewing"
    - "Assessment"
    - "Rejected"
    - "Offer Received"
