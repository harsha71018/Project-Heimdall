# ==============================================================================
# Job Hunter & Excel Dashboard Configuration
# ==============================================================================

# Search settings
search:
  # Target job roles
  job_titles:
    - "Data Analyst"
    - "Data Annotator"
    - "SQL Developer"
    - "Power BI Developer"

  # Target Location
  location: "Hyderabad"

  # Experience level filter & ceiling gate
  experience_filter: "0-2 years"
  max_experience_years: 2      # Strict ceiling: discard jobs requiring > 2 years minimum
  max_range_ceiling_years: 3   # Strict range ceiling: discard wide ranges (e.g. 0-5, 0-7, 2-5, 2-6)
  
  # Max age of job postings in hours (24h for fresh daily listings)
  hours_old: 24
  
  # Target number of jobs to fetch per title via JobSpy (kept at 12 to prevent LinkedIn 429 rate limits)
  results_wanted_per_role: 12
  
  # Platforms to search across: linkedin, indeed
  platforms:
    - "linkedin"

    


# ==============================================================================
# Scraping Modes & Firecrawl Engine Configuration
# ==============================================================================
# Choose default scraping mode: "frugal", "balanced", or "exhaustive"
default_mode: "balanced"

modes:
  frugal:
    search_limit_per_role: 10
    deep_scrape: false
    timeout: 20
    jobspy_results: 8
    description: "8 credits total: Fast SERP snippets (4 roles x 2 search credits)"

  balanced:
    search_limit_per_role: 4
    deep_scrape: true
    timeout: 60
    jobspy_results: 12
    description: "24 credits total: Full markdown on top 4 listings per role (4 roles x (2 search + 4 scrape))"

  exhaustive:
    search_limit_per_role: 10
    deep_scrape: true
    timeout: 60
    jobspy_results: 14
    description: "48 credits total: Full markdown on top 10 listings per role (4 roles x (2 search + 10 scrape))"

  deep:
    search_limit_per_role: 10
    deep_scrape: true
    timeout: 60
    jobspy_results: 14
    description: "Deep sweep with full markdown on top listings (alias for exhaustive)"

firecrawl:
  enabled: true

# ==============================================================================
# AI Decision Gatekeeper (Tier 2 - Semantic Validation)
# Evaluates candidate leads via OpenRouter free tier.
# Fail-open: smoothly skipped if OPENROUTER_API_KEY is not set in .env.
# ==============================================================================
ai_gatekeeper:
  enabled: true
  provider: "openrouter"
  model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  fallback_model: "openrouter/free"
  min_fit_score: 6.0

# Skill Extraction & Highlighting
skills_filter:
  target_skills:
    - "SQL"
    - "Power BI"
    - "Python"
    - "Excel"
    - "Advanced Excel"
    - "Tableau"
    - "Data Annotation"
    - "Data Cleaning"
    - "ETL"
    - "PostgreSQL"
    - "MySQL"
    - "Pandas"
    - "NumPy"
    - "Statistics"
    - "Data Modeling"
    - "DAX"
    - "Power Query"
    - "Machine Learning"
    - "AI"
    - "Azure"
    - "AWS"
    - "Git"
    - "Snowflake"
    - "BigQuery"

# Excel Output Settings
output:
  filename: "Job_Applications_Tracker.xlsx"
  stable_filename: "Tracker_Latest.xlsx"
  leads_dir: "leads"
  applications_file: "applications.json"
  seen_jobs_file: "seen_jobs.json"
  sheet_name: "Active Job Leads"
  
  status_options:
    - "Not Applied"
    - "Applied"
    - "Referral Requested"
    - "Screening Call"
    - "Interviewing"
    - "Assessment"
    - "Rejected"
    - "Offer Received"
    - "Ignored"
    - "Not Accepting Applications"
